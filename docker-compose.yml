version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: emergency_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: emergency_wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emergency_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Server
      dockerfile: infrastructure/docker/backend.Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./Server/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./Server/src:/app/src
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./Client
      dockerfile: ../Server/infrastructure/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./Client/src:/app/src
      - ./Client/public:/app/public
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
